<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>別讓病人爆炸｜雙和急救車挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF2; --paper:#FFFFFF; --ink:#1B2530; --muted:#5A6674;
  --cart:#C8102E; --cart-dark:#8C0A1F; --cart-hi:#E23A51; --frame:#D2582A; --drawer:#E0A43A; --drawer-hi:#EDBA5A; --tag:#FFE45C;
  --steel:#B9C2CC; --steel-dark:#7D8894; --plate:#FFFDF6;
  --amber:#F2A900; --ok:#179A63; --bad:#C8102E; --focus:#1F6FEB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --paper:#1D252F; --ink:#E6ECF2; --muted:#9BA7B4;
    --steel:#46515E; --steel-dark:#2E3740; --plate:#F4F1E6;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --paper:#1D252F; --ink:#E6ECF2; --muted:#9BA7B4;
  --steel:#46515E; --steel-dark:#2E3740; --plate:#F4F1E6;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.screen{display:none;max-width:1040px;margin:0 auto;padding:16px}
.screen.active{display:block}

/* ---------- Home ---------- */
.home{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-top:24px}
.home h1{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.05;margin:0 0 12px;font-weight:900;letter-spacing:-.02em}
.home h1 span{display:block;font-size:.42em;font-weight:700;color:var(--muted);letter-spacing:0;margin-top:10px}
.rules{max-width:34em;color:var(--muted);margin:0 0 24px}
.rules b{color:var(--ink)}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:1.05rem}
.btn-main{background:var(--cart);color:#fff;box-shadow:0 4px 0 var(--cart-dark)}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cart-dark)}
.btn-ghost{background:transparent;border:2px solid var(--steel-dark)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.toggle{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--muted);font-size:.95rem}
.toggle input{width:20px;height:20px;accent-color:var(--cart)}
.best{margin-top:10px;font-size:.95rem;color:var(--muted)}
.home-art{display:flex;justify-content:center}
.home-art svg{width:100%;max-width:340px;height:auto}

/* ---------- Cart ---------- */
.cart{width:100%;max-width:360px;margin:0 auto;user-select:none}
.zone{display:block;width:100%;border:0;text-align:left;position:relative;transition:transform .12s,filter .12s}
.zone:hover{filter:brightness(1.06)}
.zone.top{background:linear-gradient(#EFE3C2,#D8C79C);border-radius:12px 12px 4px 4px;height:64px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.zone.top::before{content:"";width:14px;height:30px;border-radius:4px 4px 2px 2px;background:#fff;box-shadow:20px 0 0 #fff,40px 0 0 #F4D6D6;margin-right:40px}
.zone.board{background:linear-gradient(#C9CED4,#A9B0B8);height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-top:3px solid #8A929B;border-bottom:3px solid #8A929B}
.zone.board .slot{flex:1;height:8px;margin-left:12px;border-radius:4px;background:#2A2F35;box-shadow:inset 0 2px 0 #11151A}
.cart-body{display:grid;grid-template-columns:48px 1fr;background:var(--frame);padding:8px 8px 10px 0;border-radius:0 0 8px 8px}
.zone.side{background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.zone.side .tank{width:26px;flex:1;min-height:60px;border-radius:13px 13px 6px 6px;background:linear-gradient(90deg,#9CC3E8,#D6E9FA 45%,#9CC3E8);margin-top:4px}
.zone.side .plate{writing-mode:vertical-rl;padding:6px 3px;flex:none;font-size:.85rem}
.zone.side .plate b{letter-spacing:.1em}
.drawers{display:flex;flex-direction:column;gap:6px}
.zone.drawer{background:linear-gradient(var(--drawer-hi),var(--drawer));height:56px;border-radius:6px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.drawers .zone.drawer:last-child{background:linear-gradient(#E0703F,#C9502A)}
.zone.drawer .plate{background:var(--tag)}
.handle{width:64px;height:10px;border-radius:5px;background:linear-gradient(#E9EDF1,#9AA4AE);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.plate{background:var(--plate);color:#1B2530;border-radius:4px;padding:2px 8px;font-size:.92rem;line-height:1.3;display:inline-flex;flex-direction:column}
.plate small{font-size:.75rem;color:#5A6674}
.wheels{display:flex;justify-content:space-between;padding:0 18px}
.wheels span{width:26px;height:26px;border-radius:50%;background:#27313B;box-shadow:inset 0 0 0 7px #4A5561}
.zone.good{animation:good .6s;outline:4px solid var(--ok);outline-offset:2px;z-index:2}
.zone.show{outline:4px dashed var(--ok);outline-offset:2px;z-index:2}
.zone.wrong{animation:shake .4s}
.zone.picked{outline:4px solid var(--amber);outline-offset:2px}
@keyframes good{50%{transform:translateX(10px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Study ---------- */
.study{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.study h2{margin:0 0 4px;font-size:1.6rem}
.study .lead{color:var(--muted);margin:0 0 16px}
.panel{background:var(--paper);border-radius:14px;padding:18px 20px;min-height:220px}
.panel h3{margin:0 0 8px;font-size:1.2rem}
.panel ul{margin:0;padding-left:1.2em}
.panel li{padding:3px 0}
.panel .empty{color:var(--muted)}

/* ---------- Game ---------- */
.hud{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.hud .stat{font-size:.85rem;color:var(--muted)}
.hud .stat b{font-size:1.4rem;color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.hud .quit{margin-left:auto;background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.order{background:var(--paper);border-radius:16px;padding:14px 18px;position:relative;margin-bottom:14px;min-height:88px}
.order::after{content:"";position:absolute;left:36px;bottom:-12px;border:12px solid transparent;border-top-color:var(--paper);border-bottom:0}
.order .who{font-size:.8rem;color:var(--muted)}
.order p{margin:2px 0 0;font-size:clamp(1.25rem,3.4vw,1.6rem);font-weight:900;line-height:1.3}
.order.pop{animation:pop .25s}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.patient-wrap{position:relative;display:flex;justify-content:center}
.patient-wrap svg{width:100%;max-width:340px;height:auto;overflow:visible}
#head{transform-box:view-box;transform-origin:120px 104px;transition:transform .25s}
.panic-eyes,.sweat{opacity:0;transition:opacity .2s}
.panic .panic-eyes,.sweaty .sweat{opacity:1}
.panic .calm-eyes{opacity:0}
.meter{margin-top:6px}
.meter-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.meter-track{height:16px;border-radius:8px;background:var(--steel);overflow:hidden}
.meter-fill{height:100%;width:20%;background:var(--amber);border-radius:8px}
.meter.danger .meter-fill{background:var(--bad);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
.cart-area{position:relative}
.quiz{position:absolute;inset:-6px;background:var(--paper);border-radius:14px;padding:18px;display:none;flex-direction:column;gap:12px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.quiz.on{display:flex}
.quiz h3{margin:0;font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--bg);border-radius:6px;padding:3px 8px;font-size:.88rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.opts button{border:2px solid var(--steel-dark);background:transparent;border-radius:10px;padding:12px 8px;font-weight:700;line-height:1.3}
.opts button.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.opts button.no{border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;transition:.2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--ok);color:#fff}
.toast.bad{background:var(--bad);color:#fff}

/* ---------- Boom ---------- */
.boom{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;pointer-events:none}
.boom.on{display:flex}
.boom .flash{position:absolute;inset:0;background:#fff;animation:flash .5s forwards}
.boom svg{width:min(90vw,560px);animation:burst .7s cubic-bezier(.2,1.6,.4,1) forwards}
.boom .bit{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:3px;animation:fly 1s ease-out forwards}
@keyframes flash{to{opacity:0}}
@keyframes burst{from{transform:scale(.1) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
body.shake .screen.active{animation:shake .12s 5}

/* ---------- Result ---------- */
.result{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px;align-items:start;padding-top:20px}
.result h2{font-size:clamp(2rem,6vw,3rem);margin:0;line-height:1.1;font-weight:900}
.result .sub{color:var(--muted);margin:6px 0 18px}
.scores{display:flex;gap:28px;margin-bottom:22px}
.scores div{font-size:.85rem;color:var(--muted)}
.scores b{display:block;font-size:2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.review{background:var(--paper);border-radius:14px;padding:16px 20px;margin-bottom:20px}
.review h3{margin:0 0 8px;font-size:1.05rem}
.review ol{margin:0;padding-left:1.3em}
.review li{padding:4px 0}
.review li span{color:var(--ok);font-weight:700}
.result-art svg{width:100%;max-width:300px;height:auto}

.namebox{margin-top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
.namebox input{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--steel);background:var(--paper);color:var(--ink);width:11em}
.toggles{display:flex;gap:18px;flex-wrap:wrap}
.extra{display:grid;grid-template-columns:.85fr 1.15fr;gap:20px;margin:28px 0 12px}
.card{background:var(--paper);border-radius:14px;padding:16px 20px}
.card h3{margin:0 0 10px;font-size:1.05rem}
.rank{display:flex;align-items:center;gap:14px}
.rank .lv{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.25rem;color:#fff;background:var(--cart);flex:none;box-shadow:0 3px 0 var(--cart-dark)}
.rank .t{font-weight:900;font-size:1.15rem}
.bar{height:10px;border-radius:5px;background:var(--steel);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:5px}
.small{font-size:.85rem;color:var(--muted)}
.stats3{display:flex;gap:22px;margin-top:14px}
.stats3 div{font-size:.8rem;color:var(--muted)}
.stats3 b{display:block;font-size:1.3rem;color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.badge{border-radius:10px;padding:8px 6px;text-align:center;background:var(--bg);font-size:.75rem;line-height:1.3;color:var(--muted)}
.badge .ic{font-size:1.6rem;display:block;line-height:1.2}
.badge b{display:block;font-size:.85rem;color:var(--ink)}
.badge.locked .ic{filter:grayscale(1);opacity:.35}
.badge.locked b{color:var(--muted)}
.badge.new{outline:3px solid var(--amber);background:var(--paper)}
.fever-tag{display:none;background:var(--amber);color:#1B2530;border-radius:8px;padding:2px 10px;font-weight:900;font-size:.9rem;animation:pulse .5s infinite alternate}
body.fever .fever-tag{display:inline-block}
body.fever .order{box-shadow:0 0 0 3px var(--amber),0 0 26px rgba(242,169,0,.6)}
@keyframes pulse{to{transform:scale(1.08)}}
.floatpt{position:absolute;right:16px;top:6px;font-weight:900;color:var(--ok);font-size:1.3rem;animation:floatup .9s forwards;pointer-events:none;white-space:nowrap}
.floatpt.gold{color:var(--amber);font-size:1.5rem}
@keyframes floatup{to{transform:translateY(-38px);opacity:0}}
.badge-pop{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140px);background:#1B2530;color:#FFE45C;padding:10px 18px;border-radius:14px;font-weight:900;z-index:60;transition:transform .35s cubic-bezier(.2,1.4,.4,1);display:flex;gap:10px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.badge-pop.on{transform:translate(-50%,0)}
.badge-pop .ic{font-size:1.8rem}
.badge-pop small{display:block;color:#fff;font-weight:400;font-size:.8rem}
.cert{background:linear-gradient(135deg,#FFF8E1,#FFFDF6);color:#1B2530;border:4px double #C8A24A;border-radius:14px;padding:18px 20px;margin-bottom:16px;text-align:center}
.cert .k{font-size:.8rem;letter-spacing:.25em;color:#8A6D1F}
.cert .nm{font-size:1.9rem;font-weight:900;margin:2px 0 6px}
.cert .rk{display:inline-block;background:var(--cart);color:#fff;border-radius:999px;padding:2px 14px;font-weight:700}
.cert .row{margin-top:10px;font-size:.95rem}
.cert .up{color:var(--cart);font-weight:900;margin-top:6px;font-size:1.1rem}
.cert .bar{background:#E8DDBF}
.cert .dt{font-size:.78rem;color:#8A6D1F;margin-top:8px}
.review .weakbar{display:flex;align-items:center;gap:10px;margin:6px 0}
.review .weakbar span{flex:none;width:9em;font-size:.9rem}
.review .weakbar .bar{flex:1;margin:0}
.review .weakbar em{font-style:normal;font-size:.85rem;color:var(--muted);width:3.5em;text-align:right}
@media (max-width:760px){
  .extra{grid-template-columns:1fr}
  .home,.study,.stage,.result{grid-template-columns:1fr;gap:16px}
  .home{min-height:auto;padding-top:24px}
  .home-art{order:-1}
  .home-art svg{max-width:220px}
  .patient-wrap svg{max-width:200px}
  .order{min-height:0}
  .result-art{text-align:center}
  .result-art svg{max-width:180px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="home">
    <div>
      <h1>別讓病人爆炸<span>雙和醫院急救車位置挑戰</span></h1>
      <p class="rules">醫師會喊出要的物品，你要<b>點出它放在急救車的哪一層</b>，還會考你藥物基數和抽屜裡少了什麼。答對病人就消一點氣；答錯或動作太慢，病人會越脹越大。膨脹指數滿了——砰。</p>
      <div class="actions">
        <button class="btn btn-main" id="btnStart">開始挑戰</button>
        <button class="btn btn-ghost" id="btnStudy">先看急救車</button>
      </div>
      <div class="namebox">你的名字 <input id="nameIn" maxlength="12" placeholder="顯示在證書上"></div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="easy"> 新手模式（抽屜顯示分類）</label>
        <label class="toggle"><input type="checkbox" id="snd"> 音效</label>
      </div>
      <div class="best" id="bestHome"></div>
      <p class="best" style="font-size:.8rem">內容依本院急救車點班本（115.07）及藥物配置圖（2026.07）；藥物數量為一般病房基數。</p>
    </div>
    <div class="home-art" id="homeArt"></div>
  </div>
  <div class="extra">
    <div class="card" id="rankCard"></div>
    <div class="card"><h3>急救徽章 <span class="small" id="badgeCount"></span></h3><div class="badges" id="badgeGrid"></div></div>
  </div>
</section>

<!-- STUDY -->
<section id="study" class="screen">
  <div class="study">
    <div>
      <h2>認識急救車</h2>
      <p class="lead">點每一層，看看裡面放了什麼。記熟了再開始挑戰。</p>
      <div id="studyCart"></div>
    </div>
    <div>
      <div class="panel" id="studyPanel"><p class="empty">點左邊急救車的任一位置查看內容。</p></div>
      <div class="actions" style="margin-top:16px">
        <button class="btn btn-main" id="btnStudyStart">我記住了，開始挑戰</button>
        <button class="btn btn-ghost" id="btnStudyHome">回首頁</button>
      </div>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="hud">
    <div class="stat">分數<b id="hScore">0</b></div>
    <div class="stat">連對<b id="hCombo">0</b></div>
    <div class="stat">關卡<b id="hLevel">1</b></div>
    <span class="fever-tag" id="feverTag"></span>
    <button class="quit" id="btnQuit">結束</button>
  </div>
  <div class="stage">
    <div>
      <div class="order" id="order"><div class="who">醫師</div><p id="orderText"></p></div>
      <div class="patient-wrap" id="patientWrap"></div>
      <div class="meter" id="meter">
        <div class="meter-label"><span>病人膨脹指數</span><span id="meterNum">20%</span></div>
        <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      </div>
    </div>
    <div class="cart-area">
      <div id="gameCart"></div>
      <div class="quiz" id="quiz">
        <h3 id="quizTitle"></h3>
        <div class="chips" id="quizChips"></div>
        <div class="opts" id="quizOpts"></div>
      </div>
    </div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="result">
    <div class="result-art" id="resultArt"></div>
    <div>
      <h2>砰！病人爆炸了</h2>
      <p class="sub" id="resultSub"></p>
      <div class="scores">
        <div>分數<b id="rScore">0</b></div>
        <div>答對<b id="rCorrect">0</b></div>
        <div>最長連對<b id="rCombo">0</b></div>
      </div>
      <div class="cert" id="cert"></div>
      <div class="review" id="newBadges" hidden></div>
      <div class="review" id="weak" hidden></div>
      <div class="review" id="review"></div>
      <div class="actions">
        <button class="btn btn-main" id="btnAgain">再挑戰一次</button>
        <button class="btn btn-ghost" id="btnReview">複習急救車</button>
      </div>
    </div>
  </div>
</section>

<div class="boom" id="boom"></div>
<div class="toast" id="toast"></div>
<div class="badge-pop" id="badgePop" role="status" aria-live="polite"></div>

<script>
/* ===== 雙和醫院急救車（依 115.07 點班本、2026.07 藥物配置圖） ===== */
const DRUGS = [
  ['Epinephrine（Adrenalin）1mg/1mL',20],['Amiodarone（Cordarone）150mg/3mL',4],['Atropine 1mg/1mL',3],
  ['Adenosine（Adenocor）6mg/2mL',5],['Ca-chloride（Vitacal）20mL',2],['Etomidate（Hypnomidate）20mg/10mL',1],
  ['Dopamine（Dopamin）200mg/5mL',4],['50% Glucose（Vitagen）20mL',4],['2% Lidocaine 100mg/5mL',2],
  ['Methylprednisolone（Mepron）40mg',2],['Midazolam（Midatin）5mg/1mL',2],['Norepinephrine 4mg/4mL',4],
  ['Magnesium sulfate 10% 20mL',2],['Succinylcholine（Relaxin）500mg',1],['7% Sodium bicarbonate（Rolikan）20mL',10]
];
const QTY = Object.fromEntries(DRUGS);
const CART = [

/* ----- 音效 ----- */
let AC = null;
function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(seq, type='sine', vol=.12){
  if(!sound) return;
  try{
    const a = ac(); let t = a.currentTime;
    seq.forEach(([f,d]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+d); t += d*.8;
    });
  }catch(e){}
}
function boomSound(){
  if(!sound) return;
  try{
    const a = ac(), n = Math.floor(a.sampleRate*.9), b = a.createBuffer(1,n,a.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const src = a.createBufferSource(), g = a.createGain(); src.buffer = b; g.gain.value = .6;
    src.connect(g).connect(a.destination); src.start();
  }catch(e){}
}

/* ===== Cart builder ===== */
function buildCart(el, onPick, showHint){
  el.innerHTML = '';
  const cart = document.createElement('div'); cart.className = 'cart';
  const plate = p => `<span class="plate"><b>${p.name}</b>${showHint&&p.hint?`<small>${p.hint}</small>`:''}</span>`;
  const mk = (p, cls, inner) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'zone '+cls; b.dataset.id = p.id;
    b.setAttribute('aria-label', p.name + (showHint&&p.hint?'，'+p.hint:''));
    b.innerHTML = inner;
    b.addEventListener('click', () => onPick(p, b));
    return b;
  };
  const top = CART.find(p=>p.type==='top'), side = CART.find(p=>p.type==='side');
  if(top) cart.append(mk(top,'top',plate(top)));
  const board = CART.find(p=>p.type==='board');
  if(board) cart.append(mk(board,'board',plate(board)+'<span class="slot"></span>'));
  const body = document.createElement('div'); body.className = 'cart-body';
  if(side) body.append(mk(side,'side',`<span class="tank"></span>${plate(side)}`));
  const dr = document.createElement('div'); dr.className = 'drawers';
  CART.filter(p=>p.type==='drawer').forEach(p => dr.append(mk(p,'drawer',plate(p)+'<span class="handle"></span>')));
  body.append(dr); cart.append(body);
  const w = document.createElement('div'); w.className = 'wheels'; w.innerHTML = '<span></span><span></span>';
  cart.append(w);
  el.append(cart);
}

let G = null, raf = 0, lastT = 0;

function toast(msg, kind, ms=1100){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on '+(kind||'');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.className='toast', ms);
}

function startGame(){
  G = {pressure:20, score:0, combo:0, maxCombo:0, correct:0, level:1, lock:true, q:null, mistakes:[], lastItem:null, running:true,
       drugOK:0, missOK:0, fastN:0, zonesOK:new Set(), zs:{}, newBadges:[], qT:0};
  document.body.classList.remove('fever');
  $('#patientWrap').innerHTML = patientSVG(false);
  buildCart($('#gameCart'), onPickZone, easy);
  $('#quiz').classList.remove('on');
  show('game');
  hud(); render();
  newQ();
  lastT = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}

function rate(){ return 3.6 + G.level*1.3; }

function loop(t){
  if(!G || !G.running) return;
  const dt = Math.min(.1,(t-lastT)/1000); lastT = t;
  if(!G.lock) G.pressure += rate()*dt;
  render();
  if(G.pressure >= 100){ explode(); return; }
  raf = requestAnimationFrame(loop);
}

function render(){
  const p = Math.max(0, Math.min(100, G.pressure));
  $('#meterFill').style.width = p+'%';
  $('#meterNum').textContent = Math.round(p)+'%';
  $('#meter').classList.toggle('danger', p>=75);
  const head = $('#head'); if(!head) return;
  head.style.transform = `scale(${1 + p/100*0.5})`;
  const hue = (28 - p*0.4 + 360) % 360, sat = 60 + p*0.15, light = 78 - p*0.2;
  $('#skin').setAttribute('fill', `hsl(${hue} ${sat}% ${light}%)`);
  const w = $('#patientWrap');
  w.classList.toggle('sweaty', p>=45);
  w.classList.toggle('panic', p>=70);
}

function hud(){
  $('#hScore').textContent = G.score;
  $('#hCombo').textContent = G.combo;
  $('#hLevel').textContent = G.level;
}

function makeQ(){
  const filled = CART.filter(p=>p.items.length);
  const all = filled.flatMap(p=>p.items.map(i=>({item:i,pos:p})));
  const multi = filled.filter(p=>p.items.length>=2);
  const r = Math.random();
  if(r < 0.18){
    let d; do { d = rand(DRUGS)[0]; } while(d===G.lastItem);
    G.lastItem = d;
    const qty = QTY[d];
    const pool = shuffle([1,2,3,4,5,6,10,20].filter(n=>n!==qty)).slice(0,3);
    return {type:'count', item:d, answerOpt:String(qty), opts:shuffle([qty,...pool]).map(String)};
  }
  if(r < 0.42 && multi.length){
    const pos = rand(multi);
    const missing = rand(pos.items);
    const others = [...new Set(shuffle(all.filter(x=>x.pos.id!==pos.id && !pos.items.includes(x.item)).map(x=>x.item)))];
    if(others.length>=3) return {type:'missing', pos, answerOpt:missing, shown:pos.items.filter(i=>i!==missing), opts:shuffle([missing,...others.slice(0,3)])};
  }
  let pos, item, n=0;
  do { pos = rand(filled); item = rand(pos.items); n++; } while(item===G.lastItem && n<10);
  G.lastItem = item;
  const answer = filled.filter(p=>p.items.includes(item)).map(p=>p.id);
  return {type:'where', item, answer};
}

function newQ(){
  if(!G.running) return;
  document.querySelectorAll('#gameCart .zone').forEach(z=>z.classList.remove('good','show','wrong'));
  G.q = makeQ();
  const q = G.q;
  const o = $('#order'); o.classList.remove('pop'); void o.offsetWidth; o.classList.add('pop');
  if(q.type==='where'){
    $('#quiz').classList.remove('on');
    $('#orderText').textContent = `${rand(PREFIX)} ${q.item}！`;
  } else {
    if(q.type==='missing'){
      $('#orderText').textContent = `護理師，${q.pos.name}少了一樣東西！`;
      $('#quizTitle').textContent = `打開${q.pos.name}（${q.pos.hint}），缺了哪一樣？`;
      $('#quizChips').innerHTML = q.shown.map(i=>`<span>${i}</span>`).join('');
    } else {
      $('#orderText').textContent = `點班時間：${q.item} 應該有幾支？`;
      $('#quizTitle').textContent = `第一層・急救藥物基數`;
      $('#quizChips').innerHTML = `<span>${q.item}</span><span>一般病房基數</span>`;
    }
    $('#quizOpts').innerHTML = '';
    q.opts.forEach(opt => {
      const b = document.createElement('button'); b.type='button'; b.dataset.v = opt;
      b.textContent = q.type==='count' ? `${opt} 支` : opt;
      b.addEventListener('click', () => onPickOpt(opt, b));
      $('#quizOpts').append(b);
    });
    $('#quiz').classList.add('on');
  }
  G.qT = performance.now();
  G.lock = false;
}

function onPickZone(p, b){
  if(!G || G.lock || G.q.type!=='where') return;
  G.lock = true;
  if(G.q.answer.includes(p.id)){
    b.classList.add('good');
    right();
  } else {
    b.classList.add('wrong');
    G.q.answer.forEach(id => document.querySelector(`#gameCart .zone[data-id="${id}"]`)?.classList.add('show'));
    const names = CART.filter(x=>G.q.answer.includes(x.id)).map(x=>x.hint?`${x.name}（${x.hint}）`:x.name).join('、');
    wrong(`${G.q.item} 在${names}`, {q:G.q.item, a:names});
  }
}

function onPickOpt(opt, b){
  if(!G || G.lock) return;
  G.lock = true;
  const q = G.q;
  [...$('#quizOpts').children].forEach(x => { if(x.dataset.v===q.answerOpt) x.classList.add('ok'); });
  if(opt===q.answerOpt){ right(); return; }
  b.classList.add('no');
  if(q.type==='missing') wrong(`${q.pos.name}少的是：${q.answerOpt}`, {q:`${q.pos.name}（${q.pos.hint}）裡有什麼`, a:q.answerOpt});
  else wrong(`${q.item}：${q.answerOpt} 支`, {q:`${q.item} 基數`, a:`${q.answerOpt} 支`});
}

function stat(ok){
  const z = zoneOf(G.q); G.zs[z] = G.zs[z] || {ok:0,n:0}; G.zs[z].n++;
  if(ok){ G.zs[z].ok++; G.zonesOK.add(z); }
}
function right(){
  stat(true);
  const q = G.q, el = performance.now() - G.qT;
  const fast = el < (q.type==='where' ? 3000 : 4500);
  if(q.type==='count') G.drugOK++;
  if(q.type==='missing') G.missOK++;
  if(fast) G.fastN++;
  G.pressure = Math.max(0, G.pressure - 22);
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  const mult = G.combo>=10 ? 3 : G.combo>=5 ? 2 : 1;
  const pts = (10 + (fast?5:0)) * mult;
  G.score += pts;
  G.correct++;
  floatPts(`+${pts}${fast?' 神速':''}`, mult>1);
  const wasFever = document.body.classList.contains('fever');
  document.body.classList.toggle('fever', mult>1);
  $('#feverTag').textContent = `×${mult} 急救黃金時間`;
  const lv = 1 + Math.floor(G.correct/5);
  if(lv > G.level){ G.level = lv; toast(`第 ${lv} 關：病人脹得更快了`, 'bad', 1300); tone([[523,.1],[659,.1],[784,.1],[1047,.25]],'triangle'); }
  else if(mult>1 && !wasFever){ toast('連對 5 題！進入急救黃金時間，分數加倍', 'good', 1300); tone([[784,.1],[1047,.1],[1319,.25]],'triangle'); }
  else { toast(rand(['正確！','就是它','漂亮','病人消氣了']), 'good', 600); tone(mult>1 ? [[1047,.08],[1568,.16]] : [[880,.08],[1320,.16]]); }
  hud(); render();
  checkLive();
  setTimeout(newQ, 520);
}

function wrong(msg, rec){
  stat(false);
  G.pressure += 18; G.combo = 0;
  document.body.classList.remove('fever');
  tone([[196,.28]],'square',.07);
  if(!G.mistakes.some(m=>m.q===rec.q)) G.mistakes.push(rec);
  hud(); render();
  if(G.pressure >= 100){ explode(); return; }
  toast(msg, 'bad', 1600);
  setTimeout(newQ, 1700);
}

function explode(){
  G.running = false; G.lock = true;
  cancelAnimationFrame(raf);
  G.prevBest = best;
  if(G.score > best){ best = G.score; store.set('cc_best', String(best)); }
  document.body.classList.remove('fever');
  boomSound();
  G.rankBefore = rankOf(xp);
  xp += G.score; games++;
  store.set('cc_xp', String(xp)); store.set('cc_games', String(games));
  const dt = new Date(), today = `${dt.getFullYear()}-${dt.getMonth()+1}-${dt.getDate()}`;
  if(!days.includes(today)){ days.push(today); days = days.slice(-30); store.set('cc_days', JSON.stringify(days)); }
  const boom = $('#boom');
  const colors = ['#F2A900','#C8102E','#FF7A1A','#FFD84D','#F2C9A0'];
  let bits = '';
  for(let i=0;i<28;i++){
    const a = Math.random()*Math.PI*2, d = 180 + Math.random()*320;
    bits += `<span class="bit" style="background:${rand(colors)};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px"></span>`;
  }
  boom.innerHTML = `<div class="flash"></div>${bits}
    <svg viewBox="0 0 400 300" aria-label="爆炸">
      <polygon points="200,10 232,90 320,40 282,122 392,130 296,172 360,262 250,208 214,292 186,208 70,272 124,176 10,150 118,120 60,40 164,92" fill="#FFD84D" stroke="#C8102E" stroke-width="10" stroke-linejoin="round"/>
      <text x="200" y="176" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-weight="900" font-size="78" fill="#C8102E" stroke="#fff" stroke-width="4" paint-order="stroke">砰！</text>
    </svg>`;
  boom.classList.add('on');
  document.body.classList.add('shake');
  setTimeout(()=>{
    boom.classList.remove('on'); document.body.classList.remove('shake');
    unlock('first'); if(games>=10) unlock('g10'); if(days.length>=3) unlock('d3'); checkLive();
    showResult();
  }, 1400);
}

function showResult(){
  $('#resultArt').innerHTML = patientSVG(true);
  $('#rScore').textContent = G.score;
  $('#rCorrect').textContent = G.correct;
  $('#rCombo').textContent = G.maxCombo;
  const lines = [
    [0,'急救車還很陌生，先去複習一輪吧。'],
    [60,'有點樣子了，再熟一點病人就撐得住。'],
    [150,'反應很快！已經是可靠的急救夥伴。'],
    [300,'急救車在你腦中有地圖，學長姐等級。']
  ];
  $('#resultSub').textContent = lines.filter(l=>G.score>=l[0]).pop()[1] + (G.score>G.prevBest && G.score>0 ? '　新的最高分！' : '');
  $('#review').innerHTML = G.mistakes.length
    ? `<h3>這次答錯的，記起來</h3><ol>${G.mistakes.map(m=>`<li>${m.q} → <span>${m.a}</span></li>`).join('')}</ol>`
    : `<h3>這次沒有答錯</h3><p style="margin:0">病人是被時間撐爆的——下次再快一點。</p>`;
  // 證書
  const R = rankHTML(xp), cur = RANKS[R.r], up = R.r > G.rankBefore;
  const d = new Date(), ds = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  if(up) setTimeout(()=>tone([[523,.12],[659,.12],[784,.12],[1047,.4]],'triangle',.12), 300);
  $('#cert').innerHTML = `<div class="k">雙和醫院・急救車挑戰</div>
    <div class="nm">${(playerName||'無名英雄').replace(/[<>&]/g,'')}</div>
    <span class="rk">${cur[1]}・${cur[2]}</span>
    ${up ? `<div class="up">🎉 晉升為 ${cur[1]}・${cur[2]}！</div>` : ''}
    <div class="row">本場 <b>${G.score}</b> 分・最長連對 <b>${G.maxCombo}</b>・最高分 <b>${best}</b></div>
    <div class="bar"><i style="width:${R.pct}%"></i></div>
    <div class="small" style="color:#8A6D1F">${R.next}</div>
    <div class="dt">${ds}　截圖這張卡片分享到群組</div>`;
  // 新徽章
  const nb = $('#newBadges');
  if(G.newBadges.length){
    nb.hidden = false;
    nb.innerHTML = `<h3>這場新拿到的徽章</h3><div class="badges">${G.newBadges.map(id=>{const b=BADGES.find(x=>x[0]===id);return `<div class="badge new"><span class="ic">${b[1]}</span><b>${b[2]}</b>${b[3]}</div>`;}).join('')}</div>`;
  } else nb.hidden = true;
  // 弱點
  const weak = Object.entries(G.zs).filter(([,v])=>v.n>v.ok).sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n)).slice(0,3);
  const wk = $('#weak');
  if(weak.length){
    wk.hidden = false;
    wk.innerHTML = `<h3>最需要加強的位置</h3>` + weak.map(([id,v])=>{
      const z = CART.find(x=>x.id===id), pct = Math.round(v.ok/v.n*100);
      return `<div class="weakbar"><span>${z.name}${z.hint?'・'+z.hint:''}</span><div class="bar"><i style="width:${pct}%;background:${pct<50?'var(--bad)':'var(--amber)'}"></i></div><em>${v.ok}/${v.n}</em></div>`;
    }).join('');
  } else wk.hidden = true;
  updateBest();
  show('result');
}

$('#btnStart').addEventListener('click', startGame);
$('#btnStudy').addEventListener('click', openStudy);
$('#btnStudyStart').addEventListener('click', startGame);
$('#btnStudyHome').addEventListener('click', ()=>show('home'));
$('#btnAgain').addEventListener('click', startGame);
$('#btnReview').addEventListener('click', openStudy);
$('#btnQuit').addEventListener('click', ()=>{ if(G){ G.running=false; cancelAnimationFrame(raf);} document.body.classList.remove('fever'); updateBest(); show('home'); });
</script>
</body>
